name: Download Frida Gadget

on:
  workflow_dispatch:
    inputs:
      gadget_version:
        description: 'Версия Frida gadget'
        required: false
        default: '16.2.2'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Extract Frida Gadget
        run: |
          VERSION="${{ github.event.inputs.gadget_version }}"
          curl -fL "https://github.com{VERSION}/frida-gadget-${VERSION}-ios-universal.dylib.gz" -o gadget.dylib.gz
          gunzip -f gadget.dylib.gz
          mv gadget.dylib FridaGadget.dylib
          ls -lh FridaGadget.dylib

      - name: Upload FridaGadget.dylib
        uses: actions/upload-artifact@v4
        with:
          name: FridaGadget-dylib
          path: FridaGadget.dylib
