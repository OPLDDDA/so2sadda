name: Build gadget IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Прямая ссылка на расшифрованный Standoff 2 .ipa'
        required: true
      gadget_version:
        description: 'Версия Frida gadget'
        required: false
        default: '16.2.2'
      output_name:
        description: 'Имя выходного файла без .ipa'
        required: false
        default: 'Standoff2-Gadget'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install insert_dylib
        run: brew install insert_dylib

      - name: Download source IPA
        run: |
          curl -fL --retry 3 -o game.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh game.ipa

      - name: Download Frida gadget
        run: |
          VER="${{ github.event.inputs.gadget_version }}"
          curl -fL --retry 3 -o gadget.dylib.gz \
            "https://github.com/frida/frida/releases/download/${VER}/frida-gadget-${VER}-ios-universal.dylib.gz"
          gunzip -f gadget.dylib.gz
          chmod 755 gadget.dylib
          ls -lh gadget.dylib

      - name: Inject gadget and build IPA
        run: |
          bash tools/package-gadget.sh game.ipa "$PWD/gadget.dylib"
          mv game-gadget.ipa "${{ github.event.inputs.output_name }}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}-ipa
          path: ${{ github.event.inputs.output_name }}.ipa
          if-no-files-found: error
